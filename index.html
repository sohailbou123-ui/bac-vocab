<style>
  :root{
    --bg:#f2efe6;
    --panel:#fffdf7;
    --panel-raised:#ffffff;
    --ink:#14171f;
    --ink-dim:#4b4940;
    --ink-faint:#8d8878;
    --line:#14171f;
    --line-soft:#d8d2bf;
    --yellow:#ffd23f;
    --yellow-soft:#fff2c4;
    --blue:#3a5ef7;
    --blue-soft:#dde4ff;
    --pink:#ff4d6d;
    --pink-soft:#ffe0e6;
    --good:#159a5a;
    --good-soft:#d7f5e3;

    --sh:3px; --sh-lg:5px;
    --notebook-line: rgba(20,23,31,0.035);
    color-scheme: light;
  }
  :root[data-theme="gold"]{
    --bg:#15141a;
    --panel:#1e1c24;
    --panel-raised:#25222c;
    --ink:#f4ecd8;
    --ink-dim:#b7ab8e;
    --ink-faint:#726a56;
    --line:#4a3d24;
    --line-soft:#5c4c2c;
    --yellow:#e0b458;
    --yellow-soft:#332a17;
    --blue:#d9a648;
    --blue-soft:#2e2717;
    --pink:#ff7086;
    --pink-soft:#3a1a22;
    --good:#3ecf8e;
    --good-soft:#123326;
    --notebook-line: rgba(255,255,255,0.03);
    color-scheme: dark;
  }
  :root[data-theme="dark"]{
    --bg:#101116;
    --panel:#191b21;
    --panel-raised:#20222a;
    --ink:#eceef2;
    --ink-dim:#9a9da6;
    --ink-faint:#5d6069;
    --line:#33363f;
    --line-soft:#40434d;
    --yellow:#ffd23f;
    --yellow-soft:#332c10;
    --blue:#5b8cff;
    --blue-soft:#1a2440;
    --pink:#ff5c7a;
    --pink-soft:#391721;
    --good:#2ecc71;
    --good-soft:#123722;
    --notebook-line: rgba(255,255,255,0.03);
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      repeating-linear-gradient(0deg, transparent, transparent 27px, var(--notebook-line) 28px),
      var(--bg);
    color:var(--ink);
    font-family:'Space Grotesk',sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:32px 16px 60px;
    transition:background-color .2s ease, color .2s ease;

  .wrap{ width:100%; max-width:720px; }
  .masthead{
    display:flex; align-items:center; justify-content:center;
    border-bottom:none;
    padding-bottom:20px; margin-bottom:24px;
    gap:14px; flex-wrap:wrap; text-align:center;
    flex-direction:column;
  }
  .masthead-icon{
    font-size:30px; width:64px; height:64px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    background:var(--yellow);
    border:2.5px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--sh-lg) var(--sh-lg) 0 0 var(--line);
    transform:rotate(-6deg);
  }
  .masthead-titles{ display:flex; flex-direction:column; align-items:center; gap:6px; }
  .title-row{ display:flex; align-items:center; gap:10px; }
  .bac-badge{ font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:700; color:#fff; background:var(--blue); padding:4px 11px; border:2px solid var(--line); border-radius:5px; transform:rotate(4deg); letter-spacing:.5px; box-shadow:2px 2px 0 0 var(--line); }

  .creator-credit .thanks{ font-size:11px; color:var(--ink-faint); }
  .top-contact{ display:inline-flex; align-items:center; gap:7px; margin-top:10px; padding:8px 18px; border:2.5px solid var(--line); border-radius:var(--radius); background:var(--blue); color:#fff; text-decoration:none; font-family:'Tajawal',sans-serif; font-weight:700; font-size:13px; transition:.1s; box-shadow:var(--sh) var(--sh) 0 0 var(--line); }

  .unit-card{ background:var(--panel); border:2.5px solid var(--line); box-shadow:var(--sh-lg) var(--sh-lg) 0 0 var(--line); border-radius:var(--radius); padding:22px 16px; cursor:pointer; transition:transform .1s, box-shadow .1s; text-align:center; }
  .unit-card:hover{ transform:translate(-3px,-3px); box-shadow:8px 8px 0 0 var(--line); }

  .back-btn{ display:inline-block; margin-bottom:16px; padding:7px 16px; font-family:'Tajawal',sans-serif; font-size:13px; font-weight:700; background:var(--panel); border:2px solid var(--line); border-radius:var(--radius); color:var(--ink); cursor:pointer; box-shadow:2px 2px 0 0 var(--line); }
  .back-btn:hover{ transform:translate(-2px,-2px); box-shadow:4px 4px 0 0 var(--line); }
  #unitBar{ display:flex; flex-direction:column; gap:8px; background:var(--panel); border:2.5px solid var(--line); box-shadow:var(--sh) var(--sh) 0 0 var(--line); border-radius:var(--radius); padding:11px 16px; margin-bottom:16px; font-family:'Tajawal',sans-serif; }
  #unitBar .unitBar-top{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  #unitBar .cur{ font-size:13px; color:var(--ink-dim); }
  #unitBar .cur b{ color:var(--ink); background:var(--yellow-soft); padding:0 5px; border-radius:3px; font-family:'Space Grotesk',sans-serif; direction:ltr; unicode-bidi:isolate; }
  #unitBar .cur-ar{ color:var(--blue); font-weight:700; font-family:'Tajawal',sans-serif; }
  #unitBar button{ font-family:'Tajawal',sans-serif; font-size:12px; font-weight:700; padding:7px 14px; border-radius:6px; cursor:pointer; border:2px solid var(--line); background:var(--yellow); color:var(--ink); box-shadow:2px 2px 0 0 var(--line); }
  #unitBar button:hover{ transform:translate(-1px,-1px); box-shadow:3px 3px 0 0 var(--line); }

  .unit-progress span b{ color:var(--ink); }
  .speak-btn{ border:2px solid var(--line); background:var(--blue-soft); color:var(--blue); border-radius:50%; width:40px; height:40px; min-width:40px; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; font-size:16px; padding:0; line-height:1; transition:.1s; flex-shrink:0; box-shadow:2px 2px 0 0 var(--line); }

  .speak-btn.lg{ width:48px; height:48px; font-size:19px; }
  .fc-audio{ display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:12px; font-family:'Tajawal',sans-serif; font-size:12px; color:var(--ink-faint); }
  .term-list{ display:flex; flex-direction:column; gap:9px; max-height:420px; overflow-y:auto; padding-right:4px; }
  .term-row{ display:flex; align-items:center; gap:10px; padding:12px 15px; background:var(--panel); border:2px solid var(--line); border-radius:7px; box-shadow:2px 2px 0 0 var(--line); }
  .term-row-num{ font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink-faint); min-width:22px; }
  .term-row-en{ font-family:'Space Grotesk',sans-serif; font-size:16px; font-weight:700; color:var(--ink); flex:1; direction:ltr; text-align:left; }
  .term-row-ar{ font-family:'Tajawal',sans-serif; font-size:15px; font-weight:700; color:var(--blue); flex:1; text-align:right; }
  .tabs{ display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }

  .tab.active{ background:var(--yellow); color:var(--ink); transform:translate(-1px,-1px); box-shadow:3px 3px 0 0 var(--line); }
  .tab:hover:not(.active){ color:var(--ink); transform:translate(-1px,-1px); box-shadow:3px 3px 0 0 var(--line); }
  .stage{ background:var(--panel); border:2.5px solid var(--line); box-shadow:var(--sh-lg) var(--sh-lg) 0 0 var(--line); border-radius:var(--radius); padding:28px 22px; min-height:340px; display:flex; flex-direction:column; position:relative; }
  .meta-bar{ display:flex; justify-content:space-between; align-items:center; margin-top:14px; padding-top:12px; border-top:2px dashed var(--line-soft); font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--ink-faint); }
  .meta-bar span b{ color:var(--ink); }
  .fc-progress{ font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--ink-faint); text-align:center; margin-bottom:16px; }
  .flip-card{ flex:1; perspective:1200px; cursor:pointer; min-height:200px; }
  .flip-inner{ position:relative; width:100%; height:100%; min-height:200px; transition:transform .5s cubic-bezier(.4,.2,.2,1); transform-style:preserve-3d; }
  .flip-card.flipped .flip-inner{ transform:rotateY(180deg); }
  .face{ position:absolute; inset:0; backface-visibility:hidden; border:2.5px solid var(--line); border-radius:var(--radius); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; text-align:center; background:var(--panel-raised); box-shadow:4px 4px 0 0 var(--line); }
  .face.back{ transform:rotateY(180deg); background:var(--yellow-soft); }
  .face .label{ font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:1.5px; color:var(--blue); margin-bottom:14px; font-weight:700; }
  .face .term-en{ font-family:'Space Grotesk',sans-serif; font-size:32px; font-weight:700; color:var(--ink); display:flex; align-items:center; gap:10px; }
  .face .term-ar{ font-family:'Tajawal',sans-serif; font-size:28px; font-weight:800; color:var(--ink); }
  .face .hint{ margin-top:16px; font-size:12px; color:var(--ink-faint); font-family:'Tajawal',sans-serif; }
  .fc-controls{ display:flex; justify-content:center; gap:16px; margin-top:18px; flex-wrap:wrap; }
  .fc-controls .btn{ min-width:80px; }
  .drill-prompt{ text-align:center; margin-bottom:22px; }
  .drill-prompt .label{ font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:1.5px; color:var(--blue); margin-bottom:12px; font-weight:700; }
  .drill-prompt .word{ font-family:'Tajawal',sans-serif; font-size:30px; font-weight:800; color:var(--ink); }
  .drill-input{ width:100%; padding:14px 16px; font-size:18px; font-family:'JetBrains Mono',monospace; direction:ltr; text-align:center; background:var(--panel-raised); border:2.5px solid var(--line); border-radius:7px; color:var(--ink); outline:none; }
  .drill-input:focus{ box-shadow:3px 3px 0 0 var(--line); }
  .drill-input.correct{ border-color:var(--good); color:var(--good); background:var(--good-soft); }
  .drill-input.wrong{ border-color:var(--pink); color:var(--pink); background:var(--pink-soft); }
  .drill-feedback{ margin-top:12px; text-align:center; font-family:'Tajawal',sans-serif; font-size:14px; min-height:40px; color:var(--ink-dim); }
  .drill-feedback .answer{ color:var(--ink); font-family:'JetBrains Mono',monospace; font-weight:700; background:var(--yellow-soft); padding:0 5px; border-radius:3px; }
  .drill-actions{ margin-top:20px; display:flex; justify-content:center; gap:10px; flex-wrap:wrap; }
  .quiz-prompt{ text-align:center; margin-bottom:22px; }
  .quiz-prompt .label{ font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:1.5px; color:var(--blue); margin-bottom:12px; font-weight:700; }
  .quiz-prompt .word{ font-family:'Tajawal',sans-serif; font-size:30px; font-weight:800; color:var(--ink); }
  .quiz-options{ display:flex; flex-direction:column; gap:10px; }
  .quiz-opt{ padding:14px 18px; text-align:left; direction:ltr; font-family:'JetBrains Mono',monospace; font-size:15px; font-weight:600; background:var(--panel-raised); border:2.5px solid var(--line); border-radius:7px; color:var(--ink); cursor:pointer; transition:.1s; display:flex; align-items:center; justify-content:space-between; gap:10px; box-shadow:2px 2px 0 0 var(--line); }
  .quiz-opt:hover:not(.locked){ transform:translate(-2px,-2px); box-shadow:4px 4px 0 0 var(--line); background:var(--yellow-soft); }
  .quiz-opt.correct{ border-color:var(--good); background:var(--good-soft); color:var(--good); animation:pop .3s ease; }
  .quiz-opt.wrong{ border-color:var(--pink); background:var(--pink-soft); color:var(--pink); animation:shake .4s ease; }
  .quiz-opt.locked{ cursor:default; }
  .quiz-actions{ margin-top:20px; display:flex; justify-content:center; }
  .chal-topbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink-faint); }
  .chal-timer-track{ width:100%; height:8px; background:var(--panel-raised); border:2px solid var(--line); border-radius:5px; overflow:hidden; margin-bottom:20px; }
  .chal-timer-fill{ height:100%; background:var(--blue); width:100%; transition:width .1s linear, background .2s; }
  .chal-timer-fill.urgent{ background:var(--pink); animation:pulse .5s infinite; }
  .chal-prompt{ text-align:center; margin-bottom:20px; }
  .chal-prompt .label{ font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:1.5px; color:var(--blue); margin-bottom:10px; font-weight:700; }
  .chal-prompt .word{ font-family:'Tajawal',sans-serif; font-size:28px; font-weight:800; color:var(--ink); }
  .chal-options{ display:flex; flex-direction:column; gap:9px; }
  .chal-opt{ padding:13px 16px; text-align:left; direction:ltr; font-family:'JetBrains Mono',monospace; font-size:14px; font-weight:600; background:var(--panel-raised); border:2.5px solid var(--line); border-radius:7px; color:var(--ink); cursor:pointer; transition:.1s; box-shadow:2px 2px 0 0 var(--line); }
  .chal-opt:hover:not(.locked){ transform:translate(-2px,-2px); box-shadow:4px 4px 0 0 var(--line); background:var(--yellow-soft); }
  .chal-opt.correct{ border-color:var(--good); background:var(--good-soft); color:var(--good); animation:pop .3s ease; }
  .chal-opt.wrong{ border-color:var(--pink); background:var(--pink-soft); color:var(--pink); animation:shake .4s ease; }
  .chal-opt.locked{ cursor:default; }
  .chal-timeout-msg{ text-align:center; font-family:'Tajawal',sans-serif; font-size:13px; color:var(--pink); margin-top:12px; min-height:18px; }
  .badge{ display:inline-block; margin-top:14px; padding:9px 20px; border:2.5px solid var(--line); border-radius:20px; font-family:'Tajawal',sans-serif; font-size:13px; font-weight:800; color:var(--ink); background:var(--yellow); box-shadow:3px 3px 0 0 var(--line); }
  .btn{ font-family:'Tajawal',sans-serif; font-size:14px; font-weight:700; padding:11px 22px; border-radius:8px; cursor:pointer; border:2.5px solid var(--line); background:var(--panel); color:var(--ink); transition:.1s; box-shadow:2px 2px 0 0 var(--line); }
  .btn:hover{ transform:translate(-2px,-2px); box-shadow:4px 4px 0 0 var(--line); }
  .btn.primary{ background:var(--yellow); border-color:var(--line); color:var(--ink); font-weight:800; }

  .results .sub{ font-family:'Tajawal',sans-serif; color:var(--ink-dim); margin-top:10px; font-size:14px; }
  .results .btn{ margin-top:22px; }
  .contact-foot{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; margin-top:26px; padding:18px 14px; border-top:2px dashed var(--line-soft); font-family:'Tajawal',sans-serif; font-size:15px; font-weight:500; color:var(--ink-dim); text-align:center; }
  .contact-foot a{ display:flex; align-items:center; gap:8px; padding:10px 20px; border:2.5px solid var(--line); border-radius:var(--radius); background:var(--blue); color:#fff; text-decoration:none; font-weight:700; font-size:14px; transition:.1s; box-shadow:3px 3px 0 0 var(--line); }
  .contact-foot a:hover{ transform:translate(-2px,-2px); box-shadow:5px 5px 0 0 var(--line); }
  .contact-foot svg{ width:20px; height:20px; }
  @keyframes shake{ 0%,100%{transform:translateX(0);} 20%{transform:translateX(-10px);} 40%{transform:translateX(10px);} 60%{transform:translateX(-6px);} 80%{transform:translateX(6px);} }

    body{ padding:16px 8px 44px; }

// Created by awwab sohail — STOPWORDS & HELPERS
// ============================================================
//  STOPWORDS & HELPERS
// ============================================================
const STOPWORDS = new Set('a an the is are was were of in on at to and but that this it its we they he she i you with for as has have had will can could may might be been being than so from into about after before because if when more most some many much very'.split(' '));

function norm(s){ return s.toLowerCase().trim().replace(/\s+/g,' ').replace(/^to\s+/,'').replace(/[-_]/g,' '); }

function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

// Created by awwab sohail — THEME SWITCHER (light / gold / dark)
// ============================================================
//  THEME SWITCHER
// ============================================================
const THEME_KEY = 'vocabTrainerTheme_v1';
function applyTheme(theme){
  if(theme === 'light'){ document.documentElement.removeAttribute('data-theme'); }
  else { document.documentElement.setAttribute('data-theme', theme); }
  document.querySelectorAll('#themeSwitch [data-theme-btn]').forEach(b=>{
    b.classList.toggle('active', b.dataset.themeBtn === theme);
  });
  try{ localStorage.setItem(THEME_KEY, theme); }catch(err){ /* التخزين غير متاح، نتجاهل بصمت */ }
}
function initTheme(){
  let saved = 'light';
  try{ saved = localStorage.getItem(THEME_KEY) || 'light'; }catch(err){ /* تجاهل */ }
  applyTheme(saved);
  document.querySelectorAll('#themeSwitch [data-theme-btn]').forEach(b=>{
    b.addEventListener('click', ()=> applyTheme(b.dataset.themeBtn));
  });
}
initTheme();

// Created by awwab sohail — TEXT TO SPEECH
// ============================================================
//  TEXT TO SPEECH
// ============================================================
function speak(text){
  if(!text || !('speechSynthesis' in window)) return;
  try{
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'en-US';
    utter.rate = 0.92;
    window.speechSynthesis.speak(utter);
  }catch(err){ /* التشغيل الصوتي غير مدعوم في هذه البيئة، نتجاهل الخطأ بصمت */ }
}
function speakBtn(text, size){
  const safe = String(text).replace(/&/g,'&amp;').replace(/"/g,'&quot;');
  return `<button type="button" class="speak-btn${size==='lg'?' lg':''}" data-speak="${safe}" title="🔊 استمع للنطق">🔊</button>`;
}
document.addEventListener('click', (e)=>{
  const btn = e.target.closest('.speak-btn');
  if(btn){
    e.preventDefault();
    e.stopPropagation();
    if(typeof e.stopImmediatePropagation === 'function') e.stopImmediatePropagation();
    speak(btn.dataset.speak);
  }
}, true);

// Created by awwab sohail — PROGRESS STORAGE + SPACED REPETITION
// ============================================================
//  PROGRESS STORAGE (localStorage) + SPACED REPETITION
// ============================================================
const STORAGE_KEY = 'vocabTrainerProgress_v1';
let progressData = loadProgressData();

function loadProgressData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  }catch(err){ return {}; }
}
function saveProgressData(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(progressData)); }catch(err){ /* التخزين غير متاح، نتجاهل بصمت */ }
}
function getUnitProgress(unitId){
  if(!progressData[unitId]) progressData[unitId] = { words:{}, best:{} };
  return progressData[unitId];
}
function getWordBox(unitId, termId){
  const up = getUnitProgress(unitId);
  return (up.words[termId] && up.words[termId].box) || 1;
}
// box 1..5: كل ما زاد الرقم كل ما كانت الكلمة متقنة أكثر. إجابة غلط ترجعها لصندوق 1 (مراجعة قريبة)
function recordWordResult(unitId, termId, correct){
  if(!unitId) return;
  const up = getUnitProgress(unitId);
  if(!up.words[termId]) up.words[termId] = { box:1, correct:0, wrong:0 };
  const w = up.words[termId];
  if(correct){ w.box = Math.min(5, w.box+1); w.correct++; }
  else { w.box = 1; w.wrong++; }
  saveProgressData();
}
function recordBest(unitId, key, pct){
  if(!unitId) return null;
  const up = getUnitProgress(unitId);
  const prev = up.best[key];
  if(prev===undefined || pct > prev) up.best[key] = pct;
  saveProgressData();
  return prev===undefined ? null : prev;
}
function getUnitMasteryPct(unitId, total){
  if(!total) return 0;
  const up = progressData[unitId];
  if(!up) return 0;
  let mastered = 0;
  Object.values(up.words).forEach(w=>{ if(w.box>=4) mastered++; });
  return Math.round((mastered/total)*100);
}
// ترتيب "ذكي": الكلمات الضعيفة/غير المُراجَعة تطلع أول، والمتقنة تتأخر — بدل ترتيب عشوائي بحت
function smartOrder(unitId, n, terms){
  const idxs = shuffle([...Array(n).keys()]);
  if(!unitId) return idxs;
  idxs.sort((a,b)=> getWordBox(unitId, terms[a].id) - getWordBox(unitId, terms[b].id));
  return idxs;
}

// Created by awwab sohail — PART OF SPEECH CLASSIFICATION
// ============================================================
//  PART OF SPEECH (اسم / فعل / صفة / ظرف / أداة)
// ============================================================
// كل المصطلحات اسم افتراضيًا (cat:'verb' في البيانات أعلاه = فعل)، ما عدا القوائم الاستثنائية هذي:
const POS_ADJECTIVES = new Set(['Confident','Sad','Active','Passive','Vital','Depressing','Self-centred','Calm','Pacific','Upset','Ethical','Unethical','Legal','Illegal','Banned','Harmful','Underground','Genetically Modified','Overweight','Hospitalized']);
const POS_ADVERBS = new Set(['Generally','Relatively']);
const POS_PREPOSITIONS = new Set(['Against','Such As','According To']);
const POS_VERBS_EXTRA = new Set(['To Corrupt','To Cheat','Forge']);

function getPOS(term){
  const en = term.en;
  if(term.cat === 'verb' || POS_VERBS_EXTRA.has(en)) return {label:'فعل', cls:'pos-verb'};
  if(POS_ADVERBS.has(en)) return {label:'ظرف', cls:'pos-adv'};
  if(POS_PREPOSITIONS.has(en)) return {label:'حرف', cls:'pos-prep'};
  if(term.cat === 'descriptive' || POS_ADJECTIVES.has(en)) return {label:'صفة', cls:'pos-adj'};
  return {label:'اسم', cls:'pos-noun'};
}

function acceptedAnswers(term){
  const set = new Set([norm(term.en)]);
  const syns = SYNONYMS[term.en.toLowerCase()] || [];
  syns.forEach(s=>set.add(norm(s)));
  return set;
}

function isCorrectAnswer(term, input){ return acceptedAnswers(term).has(norm(input)); }

function pickDistractors(term, n=3){
  const terms = getTerms();
  const notSameWord = t => t.id!==term.id && t.en.toLowerCase()!==term.en.toLowerCase();
  const sameCat = terms.filter(t=>notSameWord(t) && t.cat===term.cat);
  const pool = shuffle(sameCat);
  let picks = pool.slice(0,n);
  if(picks.length < n){
    const rest = shuffle(terms.filter(t=>notSameWord(t) && !picks.includes(t)));
    picks = picks.concat(rest.slice(0, n-picks.length));
  }
  return picks;
}

  }
  const term = terms[chalOrder[chalIdx]];

  const distractors = pickDistractors(term,3);
  const options = shuffle([term, ...distractors]);
  stage.innerHTML = `
    <div class="chal-topbar">
      <span>⚡ CHALLENGE</span>
      <span>SCORE: <b style="color:var(--amber)">${chalScore}</b> / ${chalIdx} </span>

    fill.style.width = pct+'%';
    if(pct < 30) fill.classList.add('urgent');
    if(chalTimeLeft <= 0){
      clearInterval(chalTimer); chalTimer=null;
      lockChallenge(null, term);
    }
  }, 50);
  document.querySelectorAll('.chal-opt').forEach(opt=>{
    opt.addEventListener('click', ()=>{
      if(chalLocked) return;
      lockChallenge(opt.dataset.id, term);
    });
  });
  function lockChallenge(chosenId, term){
    if(chalLocked) return;
    chalLocked = true;
    if(chalTimer){ clearInterval(chalTimer); chalTimer=null; }
    document.querySelectorAll('.chal-opt').forEach(o=>{
      o.classList.add('locked');
      if(String(o.dataset.id)===String(term.id)) o.classList.add('correct');

    const msg = document.getElementById('chalMsg');
    if(chosenId !== null && String(chosenId) === String(term.id)){
      recordWordResult(currentUnit?.id, term.id, true);
      chalScore++;
      showFloatingFeedback('✅ '+CHEERS[Math.floor(Math.random()*CHEERS.length)], 'good');

      if(wrongEl) wrongEl.classList.add('wrong');
      showFloatingFeedback('❌ الجواب: '+term.en, 'bad');
    }
    setTimeout(()=>{
      chalIdx++;
      if(chalIdx >= terms.length) render();
      else render();
    }, 600);
  }
}

  const isHard = mode==='sentences-hard';
  const S = isHard ? sentHardState : sentState;
  if(S.idx >= terms.length){
    const pct = Math.round((S.score/terms.length)*100);
    const bestKey = isHard ? 'sentencesHard' : 'sentences';
    const prevBest = recordBest(currentUnit?.id, bestKey, pct);
    stage.innerHTML = `
      <div class="results">
        <div class="label" style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--amber-dim);">${isHard?'🔥 نتيجة الجُمل الصعبة':'📝 نتيجة الجُمل'}</div>
        <div class="big">${S.score} / ${terms.length}</div>
        <div class="sub">${pct}% — ${pct>=80?'ممتاز! 🌟':pct>=60?'جيد 👍':'راجع الجُمل 🔄'}${prevBest!==null ? ` · أفضل نتيجة سابقة: ${prevBest}%` : ''}</div>
        <button class="btn primary" id="restartSent">🔄 إعادة</button>
        <button class="btn" id="backBtn6" style="margin-top:10px;">🏠 رجوع</button>
      </div>
    `;
    document.getElementById('restartSent').onclick = ()=>{ S.order=smartOrder(currentUnit?.id, terms.length, terms); S.idx=0; S.score=0; S.streak=0; render(); };
    document.getElementById('backBtn6').onclick = backToUnits;
    return;
  }
  const term = terms[S.order[S.idx]];
  S.locked = false;
  const sentenceEn = isHard ? term.challengeEn : term.easyEn;
  const sentenceAr = isHard ? term.challengeAr : term.easyAr;
  const label = isHard ? '🔥 جملة صعبة' : '📝 جملة عادية';
  
  stage.innerHTML = `
    <div class="drill-prompt">
      <div class="label">${label}</div>
      <div class="word" style="font-size:24px;font-family:'Tajawal',sans-serif;color:var(--ink);">${sentenceAr}</div>
      <div style="font-size:13px;color:var(--ink-faint);margin-top:8px;font-family:'Tajawal',sans-serif;">💡 اكتب الجملة بالإنجليزي (بأسلوبك)</div>
    </div>
    <textarea class="drill-input" id="sentInput" rows="3" style="resize:vertical;font-family:'IBM Plex Mono',monospace;font-size:15px;direction:ltr;text-align:left;padding:12px;" placeholder="Write the sentence in English..."></textarea>
    <div class="drill-feedback" id="sentFeedback"></div>
    <div class="drill-actions">
      <button class="btn primary" id="sentCheck">تحقق ✅</button>
      <button class="btn" id="sentSkip">تخطي ⏭</button>
    </div>
    <div class="meta-bar">
      <span>SCORE: <b id="sScore">${S.score}</b></span>
      <span>STREAK: <b id="sStreak">${S.streak}</b></span>
      <span>${S.idx+1} / ${terms.length}</span>
    </div>
  `;
  const input = document.getElementById('sentInput');
  input.focus();
  const feedback = document.getElementById('sentFeedback');
  const checkBtn = document.getElementById('sentCheck');
  const skipBtn = document.getElementById('sentSkip');
  skipBtn.onclick = ()=>{
    if(S.locked) return;
    S.streak = 0;
    S.idx++;
    render();
  };

  function getKeywords(sentence){
    return sentence.toLowerCase().split(/\s+/).filter(w => w.length>2 && !STOPWORDS.has(w));
  }

  function checkSentence(){
    if(S.locked) return;
    const val = input.value.trim();
    if(!val){ feedback.innerHTML='✏️ اكتب الجملة أولاً'; return; }
    
    const keywords = getKeywords(sentenceEn);
    const targetWord = term.en.toLowerCase();
    const userWords = val.toLowerCase().split(/\s+/);
    
    const hasTarget = userWords.some(w => w===targetWord || (SYNONYMS[targetWord]||[]).some(s=>w===norm(s)));
    
    let matched = 0;
    keywords.forEach(kw => {
      if(userWords.some(w => w===kw || (SYNONYMS[kw]||[]).some(s=>w===norm(s)))) matched++;
    });
    
    const ratio = keywords.length > 0 ? matched / keywords.length : 1;
    const pct = Math.round(ratio * 100);
    
    if(hasTarget && pct >= 50){
      recordWordResult(currentUnit?.id, term.id, true);
      S.locked = true;
      S.score++; S.streak++;
      feedback.innerHTML = `✅ ${CHEERS[Math.floor(Math.random()*CHEERS.length)]} (${pct}% تطابق) ${speakBtn(sentenceEn)}`;
      document.getElementById('sScore').textContent = S.score;
      document.getElementById('sStreak').textContent = S.streak;
      checkBtn.textContent = 'التالي ▶';
      checkBtn.onclick = ()=>{ S.idx++; render(); };
      skipBtn.style.display = 'none';
    } else if(hasTarget && pct >= 30){
      recordWordResult(currentUnit?.id, term.id, false);
      S.locked = true;
      S.streak = 0;
      document.getElementById('sStreak').textContent = S.streak;
      feedback.innerHTML = `⚠️ شبه صحيح (${pct}%) — الجواب الصحيح:<br><span class="answer">${sentenceEn}</span> ${speakBtn(sentenceEn)}`;
      checkBtn.textContent = 'التالي ▶';
      checkBtn.onclick = ()=>{ S.idx++; render(); };
      skipBtn.style.display = 'none';
    } else {
      recordWordResult(currentUnit?.id, term.id, false);
      S.streak = 0;
      document.getElementById('sStreak').textContent = S.streak;
      let msg = `❌ الجواب الصحيح:<br><span class="answer">${sentenceEn}</span> ${speakBtn(sentenceEn)}`;
      if(!hasTarget) msg = `❌ المصطلح "${term.en}" غير موجود!<br><span class="answer">${sentenceEn}</span> ${speakBtn(sentenceEn)}`;
      feedback.innerHTML = msg;
      input.classList.add('wrong','shake-fx');
      setTimeout(()=>{ input.classList.remove('wrong','shake-fx'); input.value=''; input.focus(); }, 1200);
    }
  }
  checkBtn.onclick = checkSentence;
  input.addEventListener('keydown', e=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); checkSentence(); } });
}

    {id:'sentences-hard', label:'🔥 جُمل صعبة'}
  ];
  const container = document.createElement('div');
  container.className = 'tabs';
  container.id = 'tabContainer';
  tabs.forEach(t=>{
    const div = document.createElement('div');
    div.className = 'tab' + (mode===t.id?' active':'');
    div.dataset.mode = t.id;
    div.textContent = t.label;
    container.appendChild(div);
  });
  const stage = document.getElementById('stage');
  stage.parentNode.insertBefore(container, stage);
  
  container.querySelectorAll('.tab').forEach(t=>{
    t.addEventListener('click',()=>{
      if(!currentUnit){ return; }
      container.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
      t.classList.add('active');
      mode = t.dataset.mode;
      render();
    });
  });
}

//  INIT
// ============================================================
setupTabs();
render();
const unitCountEl = document.getElementById('unitCount');
if(unitCountEl) unitCountEl.textContent = Object.keys(UNITS).length;
window.backToUnits = backToUnits;
</script>
